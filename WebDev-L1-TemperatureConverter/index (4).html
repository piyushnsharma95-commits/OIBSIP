<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="C:\Users\Piyush Sharma\OneDrive\Desktop\OASIS\Task-3\css.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="converter-box">
            <h1>Temperature Converter</h1>
            <p class="subtitle">
                Convert Celsius, Fahrenheit and Kelvin
            </p>
            <label for="temperature">
                Enter Temperature
            </label>
            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
                step="any"
            >
            <label for="unit">
                Select Unit
            </label>
            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
            <button id="convertBtn">
                Convert
            </button>
            <p id="error"></p>
            <div id="result">
                <h2>Result</h2>
                <p>
                    Celsius:
                    <span id="celsius">--</span>
                </p>
                <p>
                    Fahrenheit:
                    <span id="fahrenheit">--</span>
                </p>
                <p>
                    Kelvin:
                    <span id="kelvin">--</span>
                </p>
            </div>
        </div>
    </div>
    <script src="C:\Users\Piyush Sharma\OneDrive\Desktop\OASIS\Task-3\script.js"></script>
</body>
</html>
